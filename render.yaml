services:
  - type: web
    name: projectdna-nexus
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn nexus.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
